name: paper-b

channels:
  - conda-forge

dependencies:
  # Canonical conda environment for the repository.
  # Python 3.12 is pinned because the validated Paper B stack uses Python 3.12.
  - python=3.12
  - pip

  # Interactive / workflow utilities retained from the legacy environment spec.
  - ipython
  - jupyterlab
  - tqdm
  - openpyxl

  # Scientific stack installed through pip so the validated versions are
  # identical across local runs and CI/reconstruction environments.
  - pip:
      - mesa==3.5.1
      - numpy==1.26.4
      - scipy==1.13.1
      - scikit-learn==1.5.2
      - networkx==3.3
      - pandas==2.2.3
      - matplotlib==3.9.2

      # Supporting packages used elsewhere in the repository.
      - dill
      - seaborn
      - plotly==5.24.1
