name: Paper B theory reconstruction checks

on:
  workflow_dispatch:
  push:
    branches:
      - paper-b-theory-reconstruction
      - paper-b-validity-redesign
      - paper-b-canonical-production
      - paper-b-measurement-audit
      - paper-b-mechanism-robustness
    paths:
      - "model/**"
      - "paper_b/**"
      - "scripts/smoke_test.py"
      - "scripts/run_paper_b_pilot_ucloud.sh"
      - "scripts/run_paper_b_horizon_sensitivity.sh"
      - "scripts/run_paper_b_exp3_production.sh"
      - "scripts/run_paper_b_exp3_stress.sh"
      - "scripts/run_paper_b_exp3_floor_sensitivity.sh"
      - "scripts/run_paper_b_exp3b_diagnostic.sh"
      - "scripts/run_paper_b_exp3b_extension50.sh"
      - "scripts/run_paper_b_exp3b_cumulative100.sh"
      - "scripts/run_paper_b_exp4_production.sh"
      - "scripts/run_paper_b_validity_redesign.sh"
      - "scripts/run_paper_b_social_evidence_floor.sh"
      - "scripts/run_paper_b_final_calibration.sh"
      - "scripts/run_paper_b_canonical_production.sh"
      - "scripts/run_paper_b_measurement_phase_a.sh"
      - "scripts/run_paper_b_measurement_audit.sh"
      - "scripts/run_paper_b_expert_rank_audit.sh"
      - "scripts/run_paper_b_mechanism_robustness.sh"
      - "scripts/run_paper_b_jammer_posterior_validation.sh"
      - "scripts/run_paper_b_posterior_gain_floor_sensitivity.sh"
      - "environment.yml"
      - ".github/workflows/paper_b_smoke.yml"
  pull_request:
    paths:
      - "model/**"
      - "paper_b/**"
      - "scripts/smoke_test.py"
      - "scripts/run_paper_b_pilot_ucloud.sh"
      - "scripts/run_paper_b_horizon_sensitivity.sh"
      - "scripts/run_paper_b_exp3_production.sh"
      - "scripts/run_paper_b_exp3b_diagnostic.sh"
      - "scripts/run_paper_b_exp3b_extension50.sh"
      - "scripts/run_paper_b_exp3b_cumulative100.sh"
      - "scripts/run_paper_b_exp4_production.sh"
      - "scripts/run_paper_b_final_calibration.sh"
      - "scripts/run_paper_b_canonical_production.sh"
      - "scripts/run_paper_b_measurement_phase_a.sh"
      - "scripts/run_paper_b_measurement_audit.sh"
      - "scripts/run_paper_b_expert_rank_audit.sh"
      - "scripts/run_paper_b_mechanism_robustness.sh"
      - "environment.yml"
      - ".github/workflows/paper_b_smoke.yml"

permissions:
  contents: read

concurrency:
  group: paper-b-smoke-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  theory-reconstruction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "mesa==3.5.1" \
            "numpy==1.26.4" \
            "scipy==1.13.1" \
            "scikit-learn==1.5.2" \
            "networkx==3.3"

      - name: Run legacy-API smoke test
        run: python -m scripts.smoke_test

      - name: Run Paper B wrapper smoke test
        run: python -m paper_b.experiments.smoke_pipeline

      - name: Run theory reconstruction checks
        run: python -m paper_b.experiments.check_reconstruction

      - name: Run validity-redesign deterministic checks
        run: python -m paper_b.experiments.check_validity_redesign

      - name: Smoke-test validity-redesign diagnostic runner
        run: |
          python -m paper_b.experiments.run_validity_redesign \
            --seeds 1 \
            --seed-start 5001 \
            --n-citizens 20 \
            --horizon 8 \
            --workers 1 \
            --truth-clone-seeds 1 \
            --output-dir /tmp/paper_b_validity_smoke
          python - <<'PY'
          import json
          from pathlib import Path

          gates = list(
              Path("/tmp/paper_b_validity_smoke").glob(
                  "validity_*/validity_gate.json"
              )
          )
          assert len(gates) == 1, gates
          gate = json.loads(gates[0].read_text())
          print(json.dumps(gate, indent=2, sort_keys=True))
          assert gate["pass"] is True
          assert gate["observed_runs"] == 48
          bundles = list(
              Path("/tmp/paper_b_validity_smoke").glob(
                  "validity_*/paper_b_validity_*_shareable.zip"
              )
          )
          assert len(bundles) == 1, bundles
          PY

      - name: Smoke-test social evidence floor diagnostic
        run: |
          python -m paper_b.experiments.run_social_evidence_floor \
            --seeds 1 \
            --seed-start 5101 \
            --n-citizens 20 \
            --horizon 8 \
            --workers 1 \
            --output-dir /tmp/paper_b_social_floor_smoke
          python - <<'PY'
          import json
          from pathlib import Path

          gates = list(
              Path("/tmp/paper_b_social_floor_smoke").glob(
                  "social_floor_*/social_floor_gate.json"
              )
          )
          assert len(gates) == 1, gates
          gate = json.loads(gates[0].read_text())
          print(json.dumps(gate, indent=2, sort_keys=True))
          assert gate["pass"] is True
          assert gate["observed_runs"] == 28
          assert gate["precommitted_early_floor_screen"] is None
          bundles = list(
              Path("/tmp/paper_b_social_floor_smoke").glob(
                  "social_floor_*/paper_b_social_floor_*_shareable.zip"
              )
          )
          assert len(bundles) == 1, bundles
          PY

      - name: Check final calibration design
        run: python -m paper_b.experiments.check_final_calibration

      - name: Smoke-test final calibration runner
        run: |
          python -m paper_b.experiments.run_final_calibration \
            --seeds 1 \
            --seed-start 5101 \
            --n-citizens 20 \
            --horizon 8 \
            --workers 1 \
            --output-dir /tmp/paper_b_final_calibration_smoke
          python - <<'PY'
          import json
          from pathlib import Path

          gates = list(
              Path("/tmp/paper_b_final_calibration_smoke").glob(
                  "final_calibration_*/final_calibration_gate.json"
              )
          )
          assert len(gates) == 1, gates
          gate = json.loads(gates[0].read_text())
          print(json.dumps(gate, indent=2, sort_keys=True))
          assert gate["pass"] is True
          assert gate["observed_runs"] == 20
          assert gate["horizon_evaluable"] is False
          bundles = list(
              Path("/tmp/paper_b_final_calibration_smoke").glob(
                  "final_calibration_*/paper_b_final_calibration_*_shareable.zip"
              )
          )
          assert len(bundles) == 1, bundles
          PY

      - name: Check canonical production design
        run: python -m paper_b.experiments.check_canonical_production

      - name: Smoke-test canonical production runner
        run: |
          python -m paper_b.experiments.run_canonical_production \
            --seeds 1 \
            --seed-start 6001 \
            --n-citizens 20 \
            --horizon 8 \
            --workers 1 \
            --experiments III,IV \
            --output-dir /tmp/paper_b_production_smoke
          python - <<'PY'
          import json
          from pathlib import Path

          gates = list(
              Path("/tmp/paper_b_production_smoke").glob(
                  "production_*/production_gate.json"
              )
          )
          assert len(gates) == 1, gates
          gate = json.loads(gates[0].read_text())
          print(json.dumps(gate, indent=2, sort_keys=True))
          assert gate["pass"] is True
          assert gate["observed_runs"] == 24
          assert gate["canonical_design_match"] is False
          assert gate["canonical_production_eligible"] is False
          bundles = list(
              Path("/tmp/paper_b_production_smoke").glob(
                  "production_*/paper_b_production_review_*.zip"
              )
          )
          assert len(bundles) == 1, bundles
          PY

      - name: Check measurement audit
        run: python -m paper_b.experiments.check_measurement_audit

      - name: Smoke-test Phase A measurement analysis
        run: |
          PROD_ROOT="$(find /tmp/paper_b_production_smoke -maxdepth 1 -type d -name 'production_*' | head -n 1)"
          test -n "$PROD_ROOT"
          python -m paper_b.experiments.analyze_measurement_phase_a \
            --production-root "$PROD_ROOT" \
            --output-dir /tmp/paper_b_measurement_phase_a_smoke
          test -f /tmp/paper_b_measurement_phase_a_smoke/paper_b_measurement_phase_a.zip

      - name: Smoke-test passive measurement rerun
        run: |
          python -m paper_b.experiments.run_measurement_audit \
            --seeds 1 \
            --seed-start 6001 \
            --n-citizens 20 \
            --horizon 8 \
            --workers 1 \
            --experiments III,IV \
            --output-dir /tmp/paper_b_measurement_smoke \
            --skip-reference-gate
          python - <<'PY'
          import json
          from pathlib import Path

          gates = list(
              Path("/tmp/paper_b_measurement_smoke").glob(
                  "measurement_*/measurement_gate.json"
              )
          )
          assert len(gates) == 1, gates
          gate = json.loads(gates[0].read_text())
          print(json.dumps(gate, indent=2, sort_keys=True))
          assert gate["observed_runs"] == 24
          assert gate["reference_gate_skipped"] is True
          assert gate["canonical_design_match"] is False
          assert gate["null_last_share_minimum"] == 1.0

          evidence = list(
              Path("/tmp/paper_b_measurement_smoke").glob(
                  "measurement_*/evidence_checkpoints.csv.gz"
              )
          )
          assert len(evidence) == 1, evidence
          bundles = list(
              Path("/tmp/paper_b_measurement_smoke").glob(
                  "measurement_*/paper_b_measurement_review_*.zip"
              )
          )
          assert len(bundles) == 1, bundles
          PY

      - name: Check mechanism robustness
        run: python -m paper_b.experiments.check_mechanism_robustness

      - name: Validate mechanism wrapper environment parsing
        run: |
          PAPER_B_WORKERS=12 PAPER_B_VALIDATE_ONLY=1 \
            bash scripts/run_paper_b_mechanism_robustness.sh

      - name: Smoke-test Expert-rank reconstruction
        run: |
          python -m paper_b.experiments.analyze_expert_rank_mechanism \
            --seeds 2 \
            --seed-start 6001 \
            --n-citizens 20 \
            --output-dir /tmp/paper_b_expert_rank_smoke
          test -f /tmp/paper_b_expert_rank_smoke/paper_b_expert_rank_audit.zip

      - name: Smoke-test mechanism robustness runner
        run: |
          python -m paper_b.experiments.run_mechanism_robustness \
            --seeds 1 \
            --seed-start 6001 \
            --n-citizens 20 \
            --horizon 8 \
            --workers 1 \
            --blocks epsilon,degree \
            --output-dir /tmp/paper_b_mechanism_smoke
          python - <<'PY'
          import json
          from pathlib import Path

          gates = list(
              Path("/tmp/paper_b_mechanism_smoke").glob(
                  "mechanism_*/mechanism_gate.json"
              )
          )
          assert len(gates) == 1, gates
          gate = json.loads(gates[0].read_text())
          print(json.dumps(gate, indent=2, sort_keys=True))
          assert gate["observed_runs"] == 24
          assert gate["expected_runs"] == 24
          assert gate["degree_nested_extension_pass"] is True
          assert gate["all_terminal_mse_finite"] is True
          assert gate["all_fixed_horizon"] is True
          assert gate["null_last_share_minimum"] == 1.0
          assert gate["canonical_base_match"] is False

          bundles = list(
              Path("/tmp/paper_b_mechanism_smoke").glob(
                  "mechanism_*/paper_b_mechanism_review_*.zip"
              )
          )
          assert len(bundles) == 1, bundles
          PY

      - name: Smoke-test local diagnostic runner
        run: |
          python -m paper_b.experiments.run_local_diagnostic \
            --seeds 1 \
            --n-citizens 20 \
            --max-steps 8 \
            --output-dir /tmp/paper_b_diagnostic

      - name: Smoke-test matched pilot runner
        run: |
          python -m paper_b.experiments.run_matched_pilot \
            --seeds 1 \
            --seed-start 1001 \
            --initial-regimes flat \
            --network-environments random_2,group_id \
            --n-citizens 20 \
            --horizon 8 \
            --workers 2 \
            --output-dir /tmp/paper_b_pilot_smoke

      - name: Smoke-test T400 horizon sensitivity outputs
        run: |
          python -m paper_b.experiments.run_matched_pilot \
            --seeds 1 \
            --seed-start 1001 \
            --initial-regimes flat \
            --network-environments random_2 \
            --n-citizens 8 \
            --horizon 400 \
            --workers 1 \
            --no-edge-log \
            --output-dir /tmp/paper_b_t400_smoke
          test -n "$(find /tmp/paper_b_t400_smoke -name horizon_sensitivity.csv -size +0c -print -quit)"
          test -n "$(find /tmp/paper_b_t400_smoke -name adaptive_frozen_horizon_sensitivity.csv -size +0c -print -quit)"

      - name: Smoke-test Experiment III matched redundancy
        run: |
          python -m paper_b.experiments.run_exp3_redundancy \
            --seeds 1 \
            --seed-start 2001 \
            --initial-regimes flat \
            --n-citizens 20 \
            --horizon 8 \
            --workers 2 \
            --output-dir /tmp/paper_b_exp3_smoke

      - name: Smoke-test Experiment III numerical SD floor override
        run: |
          python -m paper_b.experiments.run_exp3_redundancy \
            --seeds 1 \
            --seed-start 2001 \
            --initial-regimes flat \
            --n-citizens 20 \
            --horizon 8 \
            --workers 1 \
            --numerical-min-sd 1e-6 \
            --output-dir /tmp/paper_b_exp3_floor_smoke

      - name: Stress-test Experiment III asymmetric elite access
        run: |
          python -m paper_b.experiments.run_exp3_redundancy \
            --seeds 2001,2002 \
            --initial-regimes flat,polarized \
            --n-citizens 100 \
            --horizon 200 \
            --workers 2 \
            --output-dir /tmp/paper_b_exp3_regression
          python - <<'PY'
          import json
          from pathlib import Path

          gates = list(Path("/tmp/paper_b_exp3_regression").glob("exp3_*/exp3_gate.json"))
          assert len(gates) == 1, gates
          gate = json.loads(gates[0].read_text())
          print(json.dumps(gate, indent=2, sort_keys=True))
          assert gate["pass"] is True
          assert gate["max_terminal_mse"] < 1_000_000
          assert gate["max_abs_jammer_message_mean"] < 1_000_000
          max_initial_gain = 25.0 / 26.0
          min_initial_denom = 1.0 - max_initial_gain**2
          assert gate["max_individual_response_gain"] <= max_initial_gain + 1e-12
          assert gate["min_jammer_objective_denominator"] >= min_initial_denom - 1e-12
          PY

      - name: Regression-test former Experiment III runaway seed
        run: |
          python -m paper_b.experiments.run_exp3_redundancy \
            --seeds 1 \
            --seed-start 2173 \
            --initial-regimes flat \
            --n-citizens 100 \
            --horizon 200 \
            --workers 1 \
            --output-dir /tmp/paper_b_exp3_seed2173
          python - <<'PY'
          import json
          from pathlib import Path

          gates = list(Path("/tmp/paper_b_exp3_seed2173").glob("exp3_*/exp3_gate.json"))
          assert len(gates) == 1, gates
          gate = json.loads(gates[0].read_text())
          print(json.dumps(gate, indent=2, sort_keys=True))

          max_initial_gain = 25.0 / 26.0
          min_initial_denom = 1.0 - max_initial_gain**2
          assert gate["pass"] is True
          assert gate["max_individual_response_gain"] <= max_initial_gain + 1e-12
          assert gate["min_jammer_objective_denominator"] >= min_initial_denom - 1e-12
          PY

      - name: Smoke-test Experiment IIIb path independence
        run: |
          python -m paper_b.experiments.run_exp3b_path_independence \
            --seeds 1 \
            --seed-start 4001 \
            --n-citizens 100 \
            --n-gateways 10 \
            --n-relays 40 \
            --horizon 8 \
            --workers 1 \
            --output-dir /tmp/paper_b_exp3b_smoke
          python - <<'PY'
          import json
          from pathlib import Path

          gates = list(Path("/tmp/paper_b_exp3b_smoke").glob("exp3b_*/exp3b_gate.json"))
          assert len(gates) == 1, gates
          gate = json.loads(gates[0].read_text())
          print(json.dumps(gate, indent=2, sort_keys=True))
          assert gate["pass"] is True
          assert gate["focal_connectivity_gate"] is True
          assert gate["nominal_route_count_gate"] is True
          assert gate["shared_bottleneck_gate"] is True
          assert gate["elite_access_match_gate"] is True
          assert gate["source_degree_match_gate"] is True
          assert gate["focal_immediate_source_match_gate"] is True
          assert gate["gateway_indegree_match_gate"] is True
          assert gate["gateway_indegree_balance_gate"] is True
          PY

      - name: Smoke-test Experiment IIIb extension and cumulative combiner
        run: |
          python -m paper_b.experiments.run_exp3b_path_independence \
            --seeds 1 \
            --seed-start 4051 \
            --n-citizens 100 \
            --n-gateways 10 \
            --n-relays 40 \
            --horizon 8 \
            --workers 1 \
            --output-dir /tmp/paper_b_exp3b_extension_smoke
          python -m paper_b.experiments.combine_exp3b_cumulative100 \
            --base-source /tmp/paper_b_exp3b_smoke \
            --extension-source /tmp/paper_b_exp3b_extension_smoke \
            --output-dir /tmp/paper_b_exp3b_cumulative_smoke \
            --expected-base-seeds 4001 \
            --expected-extension-seeds 4051
          python - <<'PY'
          import json
          from pathlib import Path

          gate = json.loads(
              Path(
                  "/tmp/paper_b_exp3b_cumulative_smoke/"
                  "exp3b_cumulative100_gate.json"
              ).read_text()
          )
          print(json.dumps(gate, indent=2, sort_keys=True))
          assert gate["pass"] is True
          assert gate["observed_base_seeds"] == 1
          assert gate["observed_extension_seeds"] == 1
          assert gate["observed_cumulative_seeds"] == 2
          assert Path(
              "/tmp/paper_b_exp3b_cumulative_smoke/"
              "paper_b_exp3b_cumulative100_shareable.zip"
          ).exists()
          PY

      - name: Smoke-test Experiment IV factorial design
        run: |
          python -m paper_b.experiments.run_exp4_homophily_segregation \
            --seeds 1 \
            --seed-start 3001 \
            --n-citizens 20 \
            --horizon 8 \
            --workers 1 \
            --output-dir /tmp/paper_b_exp4_smoke

      - name: Regression-test prior Experiment IV runaway seeds
        run: |
          python -m paper_b.experiments.run_exp4_homophily_segregation \
            --seeds 3009,3081 \
            --n-citizens 100 \
            --horizon 200 \
            --workers 2 \
            --output-dir /tmp/paper_b_exp4_regression
          python - <<'PY'
          import json
          from pathlib import Path

          gates = list(Path("/tmp/paper_b_exp4_regression").glob("exp4_*/exp4_gate.json"))
          assert len(gates) == 1, gates
          gate = json.loads(gates[0].read_text())
          print(json.dumps(gate, indent=2, sort_keys=True))
          assert gate["pass"] is True
          assert gate["max_terminal_mse"] < 1_000_000
          assert gate["max_abs_jammer_message_mean"] < 1_000_000
          max_initial_gain = 25.0 / 26.0
          min_initial_denom = 1.0 - max_initial_gain**2
          assert gate["max_individual_response_gain"] <= max_initial_gain + 1e-12
          assert gate["min_jammer_objective_denominator"] >= min_initial_denom - 1e-12
          PY
