name: Paper B pipeline smoke

on:
  workflow_dispatch:
  push:
    branches:
      - paper-b-pipeline
    paths:
      - "paper_b/**"
      - ".github/workflows/paper_b_smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "mesa==3.5.1" \
            "numpy==1.26.4" \
            "scipy==1.13.1" \
            "scikit-learn==1.5.2" \
            "networkx==3.3"

      - name: Run Paper B pipeline smoke test
        run: python -m paper_b.experiments.smoke_pipeline
