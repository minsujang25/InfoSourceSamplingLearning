name: Diagnose numerical explosion\n\non:\n  workflow_dispatch:\n  push:\n    branches:\n      - paper-b-pipeline\n    paths:\n      - "paper_b/experiments/diagnose_explosion.py"\n      - ".github/workflows/diagnose_explosion.yml"\n\npermissions:\n  contents: read\n\njobs:\n  diagnose:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          ref: ${{ github.sha }}\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n      - name: Install model dependencies\n        run: |\n          python -m pip install --upgrade pip\n          python -m pip install \\n            "mesa==3.5.1" \\n            "numpy==1.26.4" \\n            "scipy==1.13.1" \\n            "scikit-learn==1.5.2" \\n            "networkx==3.3"\n      - name: Run explosion diagnostic\n        run: python -m paper_b.experiments.diagnose_explosion\n