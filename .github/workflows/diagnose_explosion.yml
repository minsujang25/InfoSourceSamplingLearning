name: Diagnose numerical explosion

on:
  workflow_dispatch:
  push:
    branches:
      - paper-b-pipeline
    paths:
      - "paper_b/experiments/diagnose_explosion.py"
      - ".github/workflows/diagnose_explosion.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "mesa==3.5.1" \
            "numpy==1.26.4" \
            "scipy==1.13.1" \
            "scikit-learn==1.5.2" \
            "networkx==3.3"
      - name: Run explosion diagnostic
        run: python -m paper_b.experiments.diagnose_explosion
