name: Mesa migration backtest

on:
  workflow_dispatch:
  push:
    branches:
      - mesa-3.5-migration
    paths:
      - "model/**"
      - "scripts/export_backtest_snapshot.py"
      - "scripts/compare_backtest_snapshots.py"
      - "backtest/**"
      - ".github/workflows/mesa_backtest.yml"

permissions:
  contents: read

jobs:
  legacy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          ref: mesa-3.5-migration
          path: harness

      - name: Checkout legacy model
        uses: actions/checkout@v4
        with:
          ref: main
          path: legacy

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install legacy-compatible stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "mesa==2.4" \
            "numpy==1.26.4" \
            "scipy==1.13.1" \
            "scikit-learn==1.5.2" \
            "networkx==3.3"

      - name: Export legacy snapshot
        run: |
          python harness/scripts/export_backtest_snapshot.py \
            --model-root legacy \
            --output legacy.json

      - name: Upload legacy snapshot
        uses: actions/upload-artifact@v4
        with:
          name: mesa-legacy-snapshot
          path: legacy.json

  current:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migrated model
        uses: actions/checkout@v4
        with:
          ref: mesa-3.5-migration
          path: current

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install migrated stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "mesa==3.5.1" \
            "numpy==1.26.4" \
            "scipy==1.13.1" \
            "scikit-learn==1.5.2" \
            "networkx==3.3"

      - name: Run Mesa 3.5 smoke test
        working-directory: current
        run: python -m scripts.smoke_test

      - name: Export migrated snapshot
        run: |
          python current/scripts/export_backtest_snapshot.py \
            --model-root current \
            --output current.json

      - name: Upload migrated snapshot
        uses: actions/upload-artifact@v4
        with:
          name: mesa-current-snapshot
          path: current.json

  compare:
    needs: [legacy, current]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout comparator
        uses: actions/checkout@v4
        with:
          ref: mesa-3.5-migration
          path: harness

      - name: Download legacy snapshot
        uses: actions/download-artifact@v4
        with:
          name: mesa-legacy-snapshot
          path: snapshots/legacy

      - name: Download migrated snapshot
        uses: actions/download-artifact@v4
        with:
          name: mesa-current-snapshot
          path: snapshots/current

      - name: Compare matched runs
        run: |
          python harness/scripts/compare_backtest_snapshots.py \
            --legacy snapshots/legacy/legacy.json \
            --current snapshots/current/current.json \
            --report mesa_backtest_report.json

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesa-backtest-report
          path: mesa_backtest_report.json
